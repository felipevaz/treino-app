<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Treino</title>

  <!-- Fonte Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --text: #e5e7eb;
      --muted: #64748b;
      --neg: #ef4444;
      --tab: #1e293b;
      --tab-active: #22c55e;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }

    h1 {
      text-align: center;
      font-size: 2.4em;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* ===== TABS ===== */

    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 1.1em;
      background: var(--tab);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn.active {
      background: var(--tab-active);
      color: black;
    }

    /* ===== WORKOUT CONTAINERS ===== */

    .workout {
      display: none;
    }

    .workout.visible {
      display: block;
    }

    /* ===== EXERCISES ===== */

    .exercise {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .title {
      font-size: 1.4em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .row span {
      background: #020617;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.95em;
    }

    .row span[contenteditable] {
      border-bottom: 1px dashed var(--text);
    }

    .obs {
      background: #020617;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.9em;
      margin-bottom: 10px;
    }

    .obs[contenteditable] {
      border: 1px dashed var(--text);
    }

    .grid {
      display: grid;
      grid-template-rows: auto repeat(3, auto);
      gap: 10px;
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95em;
      color: black;
      min-width: 0;
    }

    .start {
      background: #22c55e;
    }

    .finish {
      background: #38bdf8;
    }

    .done {
      opacity: 0.4;
      background: #64748b;
      cursor: default;
    }

    .blink {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .timer {
      font-size: 2.6em;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: var(--muted);
    }
  </style>

</head>

<body>

  <h1>Treino</h1>

  <div class="tab-bar">
    <button class="tab-btn" data-workout="A">Treino A</button>
    <button class="tab-btn" data-workout="B">Treino B</button>
  </div>

  <div id="app"></div>

  <script>

    /* ================= DADOS ================= */

    const workouts = {
      A: [
        {
          name: "Mobilidade",
          reps: "Sequência",
          load: "0 kg",
          mobility: true,
          list: [
            "Floppy arm – 10",
            "Cat/cow – 10",
            "Best stretch – 10"
          ]
        },
        {
          name: "Pallof Press",
          reps: "10–12 / lado",
          load: "elástico",
          time: 40,
          rest: 30
        },
        {
          name: "Agachamento unilateral",
          reps: "12",
          load: "5 kg",
          time: 40,
          rest: 30
        },
        {
          name: "Flexão de braço",
          reps: "8–12",
          load: "peso corporal",
          time: 40,
          rest: 30
        },
        {
          name: "Rotação externa do antebraço",
          reps: "10",
          load: "4 kg",
          time: 40,
          rest: 30
        },
        {
          name: "Sleeper Stretch",
          reps: "1",
          load: "0 kg",
          mobility: true,
          list: []
        }
      ],

      B: [
        {
          name: "Mobilidade",
          reps: "Sequência",
          load: "0 kg",
          mobility: true,
          list: [
            "Floppy arm – 10",
            "Cat/cow – 10",
            "Best stretch – 10"
          ]
        },
        {
          name: "Barra fixa",
          reps: "4 / 3 / 2",
          load: "peso corporal",
          time: 40,
          rest: 30
        },
        {
          name: "Remada",
          reps: "10–12",
          load: "kettlebell 12 kg",
          time: 40,
          rest: 30
        },
        {
          name: "Levantamento terra KB",
          reps: "12",
          load: "15 kg",
          time: 40,
          rest: 30
        },
        {
          name: "Hanging Knee Raise",
          reps: "8–12",
          load: "peso corporal",
          time: 40,
          rest: 30
        }
      ]
    };

    /* ================= TIMER ================= */

    let currentTimer = null;

    function startCountdown(seconds, display, btn) {
      clearInterval(currentTimer);

      document.querySelectorAll(".blink").forEach(b => b.classList.remove("blink"));

      btn.classList.add("blink");
      display.style.color = window.getComputedStyle(btn).backgroundColor;

      let t = seconds;

      display.textContent = format(t);

      currentTimer = setInterval(() => {
        t--;
        display.textContent = format(t);

        if (t < 0) {
          display.style.color = "var(--neg)";
        }

      }, 1000);
    }

    function format(s) {
      const sign = s < 0 ? "-" : "";
      s = Math.abs(s);
      return sign + "0:" + s.toString().padStart(2, "0");
    }

    /* ================= RENDER ================= */

    const app = document.getElementById("app");

    function renderWorkout(key) {
      const list = workouts[key];
      const container = document.createElement("div");
      container.className = "workout";
      container.id = "workout" + key;

      list.forEach((ex, i) => {

        const div = document.createElement("div");
        div.className = "exercise";

        let mobilityHTML = "";
        if (ex.mobility) {
          mobilityHTML = `
        <ul>
          ${ex.list.map(e => `<li>${e}</li>`).join("")}
        </ul>
      `;
        }

        let seriesHTML = "";
        if (!ex.mobility) {
          seriesHTML = `
        <div class="timer" id="timer${key}${i}">0:00</div>
        <div class="button-row">
          <button class="start">▶ Série 1</button>
          <button class="finish">✔ Descanso</button>
        </div>
        <div class="button-row">
          <button class="start">▶ Série 2</button>
          <button class="finish">✔ Descanso</button>
        </div>
        <div class="button-row">
          <button class="start">▶ Série 3</button>
          <button class="finish">✔ Descanso</button>
        </div>
      `;
        }

        div.innerHTML = `
      <div class="title">${i + 1}. ${ex.name}</div>

      <div class="row">
        <span>Reps:</span>
        <span contenteditable>${ex.reps}</span>

        <span>Carga:</span>
        <span contenteditable>${ex.load}</span>
      </div>

      <div class="obs" contenteditable>Observações...</div>

      ${mobilityHTML}
      ${!ex.mobility ? `<div class="grid">${seriesHTML}</div>` : ""}
    `;

        container.appendChild(div);
      });

      app.appendChild(container);
    }

    /* ================= BIND BUTTONS ================= */

    function bindButtons(key) {
      const container = document.getElementById("workout" + key);
      const list = workouts[key];

      container.querySelectorAll(".exercise").forEach((box, i) => {

        if (list[i].mobility) return;

        const timer = box.querySelector(".timer");

        const starts = box.querySelectorAll(".start");
        const finishes = box.querySelectorAll(".finish");

        starts.forEach((btn, idx) => {
          btn.addEventListener("click", () => {
            startCountdown(list[i].time, timer, btn);
          });
        });

        finishes.forEach((btn, idx) => {
          btn.addEventListener("click", () => {
            startCountdown(list[i].rest, timer, btn);

            const startBtn = starts[idx];
            startBtn.disabled = true;
            startBtn.classList.add("done");
            startBtn.textContent = "Feito";
          });
        });

      });
    }

    /* ================= PERSISTENCE ================= */

    function setupPersistence(key) {
      const container = document.getElementById("workout" + key);
      const list = workouts[key];

      container.querySelectorAll(".exercise").forEach((box, i) => {

        const spans = box.querySelectorAll("span[contenteditable]");
        const repsEl = spans[0];
        const loadEl = spans[1];
        const obsEl = box.querySelector(".obs[contenteditable]");

        if (!repsEl || !loadEl || !obsEl) return;

        const prefix = "treino" + key + "_";

        // Restore saved values
        const savedReps = localStorage.getItem(prefix + "reps_" + i);
        const savedLoad = localStorage.getItem(prefix + "load_" + i);
        const savedObs = localStorage.getItem(prefix + "obs_" + i);
        if (savedReps !== null) repsEl.textContent = savedReps;
        if (savedLoad !== null) loadEl.textContent = savedLoad;
        if (savedObs !== null) obsEl.textContent = savedObs;

        // Save on input
        repsEl.addEventListener("input", () => {
          localStorage.setItem(prefix + "reps_" + i, repsEl.textContent);
        });
        loadEl.addEventListener("input", () => {
          localStorage.setItem(prefix + "load_" + i, loadEl.textContent);
        });
        obsEl.addEventListener("input", () => {
          localStorage.setItem(prefix + "obs_" + i, obsEl.textContent);
        });
      });
    }

    /* ================= SWITCH WORKOUT ================= */

    function switchWorkout(key) {
      // Update tab buttons
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.workout === key);
      });

      // Show/hide workout containers
      document.querySelectorAll(".workout").forEach(container => {
        container.classList.toggle("visible", container.id === "workout" + key);
      });

      // Remember preference
      localStorage.setItem("treino_selected", key);
    }

    /* ================= INIT ================= */

    // Render both workouts
    renderWorkout("A");
    renderWorkout("B");

    // Bind buttons for both
    bindButtons("A");
    bindButtons("B");

    // Setup persistence for both
    setupPersistence("A");
    setupPersistence("B");

    // Tab click handlers
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        switchWorkout(btn.dataset.workout);
      });
    });

    // Restore last selected workout (default A)
    const savedWorkout = localStorage.getItem("treino_selected") || "A";
    switchWorkout(savedWorkout);

  </script>

</body>

</html>
