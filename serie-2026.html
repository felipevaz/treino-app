:root {
  --bg: #0b1120;
  --card: #0f1a2e;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --neg: #ef4444;
  --tab: #1e293b;
  --accent: #f59e0b;
  --border: #1e293b;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 14px;
  margin: 0;
  min-height: 100vh;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
.header { text-align: center; padding: 6px 0 14px 0; }
.header-logo {
  width: 100px; height: auto;
  display: block; margin: 0 auto 2px;
  border-radius: 12px;
}
.header-title {
  font-family: 'BBH Hegarty', sans-serif;
  font-weight: 400;
  font-size: 2em;
  color: #ffffff;
  letter-spacing: 0.01em;
  line-height: 1;
}

.exercise {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
  animation: cardIn 0.5s var(--ease) backwards;
}
@media (hover: hover) { .exercise:hover { transform: translateY(-2px); box-shadow: var(--shadow); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.title {
  font-size: 1.3em; font-weight: 700; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em;
}
.title-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 28px; border-radius: 50%;
  background: #22c55e; color: black; font-size: 0.75em;
  font-weight: 700; flex-shrink: 0;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.row span { background: #020617; padding: 4px 10px; border-radius: 6px; font-size: 0.9em; }
.row span[contenteditable] { border-bottom: 1px dashed var(--muted); min-width: 50px; }
.obs {
  background: #020617; padding: 8px 10px; border-radius: 8px;
  font-size: 0.85em; margin-bottom: 10px; color: var(--muted);
}
.obs[contenteditable] { border: 1px dashed var(--border); }
.obs[contenteditable]:focus { color: var(--text); border-color: var(--muted); }
.mobility-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mobility-list li { background: #020617; padding: 8px 12px; border-radius: 8px; font-size: 0.9em; }
.mobility-list li::before { content: "○ "; color: var(--muted); }
.button-row { display: flex; gap: 8px; }
.grid { display: grid; grid-template-rows: auto repeat(3, auto); gap: 8px; }

button {
  flex: 1; padding: 10px; border-radius: 10px; border: none;
  font-family: inherit; font-weight: 600; font-size: 0.9em;
  color: black; min-width: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
  cursor: pointer;
}
button:active { transform: scale(0.96); box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { button:not(.done):hover { filter: brightness(1.07); } }
.start { background: #22c55e; }
.finish { background: #38bdf8; }
.done { opacity: 0.4; background: #64748b; cursor: default; box-shadow: none; }
.done:active { transform: none; box-shadow: none; }
.blink { animation: blinkPulse 0.5s infinite; }
@keyframes blinkPulse { 0% { opacity: 1; } 50% { opacity: 0.15; } 100% { opacity: 1; } }

/* ===== REST LINE ===== */
.rest-line {
  position: fixed; top: 0; left: 0; width: 0%; height: 3px; z-index: 90;
  background: #38bdf8; opacity: 0;
  transition: none;
}
.rest-line.active { opacity: 1; width: 100%; }
.rest-line.warn { background: #ef4444; animation: lineBlink 0.5s infinite; }
@keyframes lineBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ===== WORKOUT ===== */
.workout { display: none; }
.workout.visible { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.finish-workout {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  background: #22c55e; color: black; font-weight: 700; font-size: 1.1em;
  cursor: pointer; margin-top: 6px; box-shadow: 0 2px 8px rgba(34,197,94,0.3);
}
.finish-workout:active { transform: scale(0.97); }

/* ===== CIRCUIT ===== */
.circuit-panel {
  background: #020617; border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.circuit-panel.active {
  position: fixed; inset: 0; z-index: 190;
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
  margin: 0; padding: 26px; border-radius: 0; border: none;
  background: rgba(11,17,32,0.94);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  animation: circuitModalIn 0.28s var(--ease) both;
}
@keyframes circuitModalIn {
  from { opacity: 0; transform: translateY(16px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.circuit-kicker { color: var(--muted); font-size: 0.85em; margin-bottom: 4px; }
.circuit-title { font-size: 1.35em; font-weight: 700; margin-bottom: 4px; }
.circuit-meta { color: var(--muted); font-size: 0.9em; margin-bottom: 12px; }
.circuit-display {
  display: block;
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; margin-bottom: 12px;
}
.circuit-panel.active .circuit-display {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; text-align: center; background: transparent; border: none; padding: 0;
}
.circuit-time {
  position: absolute; font-family: 'BBH Hegarty', sans-serif;
  font-size: 3.8em; line-height: 1; color: #ffffff; text-align: center;
  letter-spacing: -0.02em;
}
.circuit-time.warn { color: var(--neg); animation: blinkPulse 0.7s infinite; }
.circuit-ring {
  display: none; position: relative; width: 240px; height: 240px;
  align-items: center; justify-content: center;
}
.circuit-panel.active .circuit-ring { display: flex; }
.circuit-circle-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.circuit-circle-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 6; }
.circuit-circle-fg {
  fill: none; stroke: #38bdf8; stroke-width: 8; stroke-linecap: round;
  transition: stroke 0.3s var(--ease);
}
.circuit-circle-fg.warn { animation: circuitCirclePulse 1.1s var(--ease) infinite; }
.circuit-info { text-align: left; }
.circuit-panel.active .circuit-info { text-align: center; }
.circuit-phase { font-size: 0.85em; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
.circuit-panel.active .circuit-phase { font-size: 1em; }
.circuit-current { font-size: 1.1em; font-weight: 700; margin-bottom: 3px; }

.circuit-next { font-size: 0.85em; color: var(--muted); }
.circuit-current, .circuit-next {
  overflow: hidden;
  transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);

}
.circuit-panel.step-leave .circuit-current,
.circuit-panel.step-leave .circuit-next {
  opacity: 0;
  transform: translateX(-18px);
}
.circuit-panel.step-enter .circuit-current,
.circuit-panel.step-enter .circuit-next {

  transform: translateX(18px);
}
.circuit-actions { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }
.circuit-panel.active .circuit-actions { width: min(360px, 100%); margin: 0 auto; }
.circuit-start { background: #22c55e; }
.circuit-reset { background: #94a3b8; color: #020617; }
.circuit-skip { background: #38bdf8; }
.circuit-exit {
  position: absolute; top: 14px; right: 14px;
  width: 40px; height: 40px; padding: 0;
  border-radius: 999px; background: rgba(255,255,255,0.08);
  color: #fff; font-size: 1.2em; line-height: 1; z-index: 2;
  overflow: hidden;
  display: none;
}
.circuit-panel.active .circuit-exit { display: grid; place-items: center; }

/* ===== TIMER MODAL ===== */
.timer-modal {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  background: rgba(11,17,32,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  flex-direction: column; gap: 24px;
  visibility: hidden; opacity: 0; transform: translateY(100%);
  transition: visibility 0s 0.25s, opacity 0.26s var(--ease), transform 0.3s var(--ease);
}
.timer-modal.show { visibility: visible; opacity: 1; transform: translateY(0); transition-delay: 0s; }
.timer-modal.hiding { transform: translateY(12px) scale(0.985); opacity: 0; transition: transform 0.28s var(--ease), opacity 0.22s ease; }
.timer-circle-wrap {
  position: relative; width: 240px; height: 240px;
  display: flex; align-items: center; justify-content: center;
}
.timer-circle-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.timer-circle-bg {
  fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 6;
}
.timer-circle-fg {
  fill: none; stroke: #ef4444; stroke-width: 8; stroke-linecap: round;
  transition: stroke 0.3s var(--ease);
}
.timer-circle.warn { animation: circlePulse 2s var(--ease) infinite; }
@keyframes circlePulse {
  0%, 100% { transform: rotate(-90deg) scale(1); }
  50% { transform: rotate(-90deg) scale(1.04); }
}
@keyframes circuitCirclePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.timer-text {
  position: absolute; font-family: 'BBH Hegarty', sans-serif;
  font-size: 3.8em; font-weight: 400; color: #ffffff;
  letter-spacing: -0.02em;
}
.timer-text.paused {
  animation: blinkPulse 0.7s infinite;
}
.timer-countdown-text {
  position: absolute; font-family: 'BBH Hegarty', sans-serif;
  font-size: 4em; font-weight: 400; color: #38bdf8;
  animation: countIn 0.7s var(--ease) forwards;
}
@keyframes countIn {
  0% { font-size: 4em; opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
  100% { font-size: 40em; opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
.timer-buttons { display: flex; gap: 10px; width: 260px; }
.timer-buttons button {
  flex: 1; padding: 12px 8px; border-radius: 10px; border: none;
  font-family: inherit; font-weight: 600; font-size: 0.85em;
  color: black; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.timer-btn-pause { background: #94a3b8; color: #fff; }
.timer-btn-restart { background: #94a3b8; color: #fff; }
.timer-btn-finish { background: #22c55e; color: #000; }
.timer-buttons button:active { transform: scale(0.95); }

/* ===== CELEBRATION ===== */
.celebrate {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  background: rgba(11, 17, 32, 0.86);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  text-align: center; padding: 24px;
}
.celebrate.show { display: flex; animation: fadeIn 0.4s var(--ease); }
.celebrate-inner { position: relative; padding: 28px 24px; animation: celebratePop 0.5s var(--ease) both; }
@keyframes celebratePop {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}
.celebrate-ring {
  width: 96px; height: 96px; margin: 0 auto 18px;
  border-radius: 50%; display: grid; place-items: center;
  background: rgba(34, 197, 94, 0.12); position: relative;
}
.celebrate-ring::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  border: 2px solid rgba(34, 197, 94, 0.45);
  animation: ringExpand 1.1s var(--ease) infinite;
}
.celebrate-ring::after {
  content: ""; position: absolute; inset: -22px; border-radius: 50%;
  border: 2px solid rgba(34, 197, 94, 0.22);
  animation: ringExpand 1.1s var(--ease) infinite 0.35s;
}
@keyframes ringExpand {
  0% { transform: scale(0.85); opacity: 0.9; }
  100% { transform: scale(1.25); opacity: 0; }
}
.celebrate-check { width: 46px; height: 46px; }
.celebrate-check path {
  stroke: #22c55e; stroke-width: 6; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 48; stroke-dashoffset: 48;
  animation: drawCheck 0.5s var(--ease) 0.15s forwards;
}
@keyframes drawCheck { to { stroke-dashoffset: 0; } }
.celebrate-title { font-size: 1.6em; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.celebrate-sub { font-size: 0.95em; color: var(--muted); }
.tab-bar { display: grid; grid-template-columns: 46px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 0 0 16px; }
.tab-btn {
  width: 100%; padding: 10px 8px; border: none; border-radius: 10px;
  background: var(--tab); color: var(--muted); font-family: inherit; font-size: 0.95em; font-weight: 700;
}
.tab-btn.active { background: #22c55e; color: #020617; }
.short-switcher {

}

.short-switch-btn {

}
.short-switch-btn.active {

}
.short-switch-note { color: var(--muted); font-size: 0.82em; line-height: 1.3; }
.home-btn {

  display: inline-grid; place-items: center;
}
.dashboard { display: none; animation: fadeIn 0.35s var(--ease); }
.dashboard.visible { display: block; }
.dash-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; margin-bottom: 14px;
}
.dash-card-title { color: var(--muted); font-size: 0.85em; margin-bottom: 6px; }
.dash-value { font-size: 1.8em; font-weight: 700; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dash-days { display: flex; justify-content: space-between; gap: 6px; }
.dash-day { flex: 1; text-align: center; font-size: 0.75em; color: var(--muted); }
.dash-dot { display: grid; place-items: center; width: 30px; height: 30px; margin: 4px auto; border-radius: 50%; background: #334155; color: var(--muted); }
.dash-dot.done { background: #22c55e; color: #020617; opacity: 1; }
.dash-actions { width: 100%; margin-top: 4px; background: #38bdf8; }
.confetti {
  position: fixed; top: -12px; border-radius: 2px; opacity: 0;
  animation: confettiFall var(--cf-dur, 2.4s) linear forwards;
}
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(105vh) rotate(540deg); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .celebrate-check path { stroke-dashoffset: 0 !important; }
}
</style>
</head>
<body>

<div id="header" class="header">
  <img src="grenz-fit-mascot-transparent.png" alt="Grenz FIT" class="header-logo">
  <div class="header-title">GrenzFIT</div>
</div>

<nav class="tab-bar" aria-label="Navegação principal">
  <button class="tab-btn home-btn active" data-view="dashboard" aria-label="Home" title="Home">⌂</button>
  <button class="tab-btn" data-view="workout" data-mode="curto">Treino curto</button>
  <button class="tab-btn" data-view="workout" data-mode="longo">Treino longo</button>
</nav>

<div id="rest-line" class="rest-line"></div>
<div id="app"></div>
<div id="dashboard" class="dashboard visible"></div>

<!-- TIMER MODAL -->
<div id="timer-modal" class="timer-modal">
  <div class="timer-circle-wrap">
    <svg class="timer-circle-svg" viewBox="0 0 240 240">
      <circle class="timer-circle-bg" cx="120" cy="120" r="110"/>
      <circle class="timer-circle-fg" id="timer-circle" cx="120" cy="120" r="110"
        stroke-dasharray="691.15" stroke-dashoffset="0"/>
    </svg>
    <span class="timer-text" id="timer-text"></span>
  </div>
  <div class="timer-buttons">
    <button class="timer-btn-pause" id="btn-pause">Pausar</button>
    <button class="timer-btn-restart" id="btn-restart">Reiniciar</button>
    <button class="timer-btn-finish" id="btn-finish">Finalizar</button>
  </div>
</div>

<!-- CELEBRATION -->
<div id="celebrate" class="celebrate" role="alertdialog" aria-label="Treino concluído">
  <div class="celebrate-inner">
    <div class="celebrate-ring">
      <svg class="celebrate-check" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M14 27 L23 36 L39 18"/>
      </svg>
    </div>
    <div class="celebrate-title">Treino concluído!</div>
    <div class="celebrate-sub">Você mandou bem. Até a próxima.</div>
  </div>
</div>

<script>
/* ===== DATA ===== */
const shortWorkouts = {
  a: [
    { name:"Mobilidade", reps:"Sequência", load:"0 kg", mobility:true, list:["Floppy arm - 10","Cat/cow - 10","Best stretch - 10"] },
    { name:"Pallof Press", reps:"10-12 / lado", load:"elástico", time:40, rest:30, sides:["E", "D"] },
    { name:"Subida no banco", reps:"12", load:"peso corporal", time:40, rest:30 },
    { name:"Flexão de braço", reps:"8-12", load:"peso corporal", time:40, rest:30 },
    { name:"Hanging Knee Raise", reps:"8-12", load:"peso corporal", time:40, rest:30 },
    { name:"Suitcase Carry", reps:"30-45 s / lado", load:"kettlebell", time:40, rest:30, sides:["E", "D"] }
  ],
  b: [
    { name:"Mobilidade", reps:"Sequência", load:"0 kg", mobility:true, list:["Floppy arm - 10","Cat/cow - 10","Best stretch - 10"] },
    { name:"Pallof Press", reps:"10-12 / lado", load:"elástico", time:40, rest:30, sides:["E", "D"] },
    { name:"Barra fixa", reps:"4 / 3 / 2", load:"peso corporal", time:40, rest:30 },
    { name:"Remada unilateral KB", reps:"10-12 / lado", load:"kettlebell 12 kg", time:40, rest:30, sides:["E", "D"] },
    { name:"Levantamento terra KB", reps:"12", load:"15 kg", time:40, rest:30 },
    { name:"Suitcase Carry", reps:"30-45 s / lado", load:"kettlebell", time:40, rest:30, sides:["E", "D"] }
  ]
};

const workouts = {
  longo: [
    { name:"Mobilidade", reps:"Sequência", load:"0 kg", mobility:true, list:["Floppy arm - 10","Cat/cow - 10","Best stretch - 10"] },
    { name:"Pallof Press", reps:"10-12 / lado", load:"elástico", time:40, rest:30, sides:["E", "D"] },
    { name:"Agachamento unilateral", reps:"12", load:"5 kg", time:40, rest:30 },
    { name:"Flexão de braço", reps:"8-12", load:"peso corporal", time:40, rest:30 },
    { name:"Barra fixa", reps:"4 / 3 / 2", load:"peso corporal", time:40, rest:30 },
    { name:"Remada", reps:"10-12", load:"kettlebell 12 kg", time:40, rest:30 },
    { name:"Levantamento terra KB", reps:"12", load:"15 kg", time:40, rest:30 },
    { name:"Hanging Knee Raise", reps:"8-12", load:"peso corporal", time:40, rest:30 },
    { name:"Suitcase Carry", reps:"30-45 s / lado", load:"kettlebell", time:40, rest:30, sides:["E", "D"] }
  ]
};

const workoutSettings = {
  curto: { circuit: true, work: 30, transition: 30, rounds: 2, countdown: 3 },
  longo: { circuit: false }
};

const shortWorkoutLabels = {
  a: "Treino curto A",
  b: "Treino curto B"
};

var shortWorkoutVariant = localStorage.getItem("treino_curto_variant") || "a";

function getShortWorkoutVariant() {
  return shortWorkouts[shortWorkoutVariant] ? shortWorkoutVariant : "a";
}

function getWorkoutExercises(mode) {
  if (mode === "curto") return shortWorkouts[getShortWorkoutVariant()];
  return workouts[mode] || [];
}

function getWorkoutStorageMode(mode) {
  return mode === "curto" ? "curto_" + getShortWorkoutVariant() : mode;
}

function getCircuitStateKey(mode) {
  return mode === "curto" ? "curto_" + getShortWorkoutVariant() : mode;
}

function getWorkoutLabel(mode) {
  if (mode === "curto") return shortWorkoutLabels[getShortWorkoutVariant()];
  return "Treino longo";
}

/* ===== FORMAT ===== */
function formatSec(s) {
  return (s < 0 ? "-" : "") + Math.abs(Math.round(s));
}

/* ===== DEVICE HELPERS ===== */
var wakeLock = null;
var audioCtx = null;

function isWorkoutVisible() {
  return !!document.querySelector(".workout.visible");
}

async function requestWakeLock() {
  if (!("wakeLock" in navigator) || !isWorkoutVisible()) return;
  try {
    if (wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", function() {
      wakeLock = null;
    });
  } catch (err) {
    wakeLock = null;
  }
}

function releaseWakeLock() {
  if (!wakeLock) return;
  var lock = wakeLock;
  wakeLock = null;
  lock.release().catch(function() {});
}

function getAudioContext() {
  if (!audioCtx) {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    audioCtx = new Ctor();
  }
  return audioCtx;
}

function unlockAudio() {
  var ctx = getAudioContext();
  if (!ctx) return;
  if (ctx.state === "suspended") {
    ctx.resume().catch(function() {});
  }
}

function playTone(frequency, durationMs, gainValue, waveType) {
  var ctx = getAudioContext();
  if (!ctx) return;
  unlockAudio();
  var now = ctx.currentTime;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = waveType || "sine";
  osc.frequency.setValueAtTime(frequency, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(gainValue || 0.08, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + durationMs / 1000 + 0.03);
}

function playCue(kind) {
  if (kind === "countdown") {
    playTone(880, 70, 0.06, "square");
    return;
  }
  if (kind === "tick") {
    playTone(920, 45, 0.045, "square");
    return;
  }
  if (kind === "round") {
    playTone(880, 60, 0.06, "square");
    setTimeout(function() { playTone(1040, 60, 0.05, "square"); }, 90);
    return;
  }
  if (kind === "end") {
    playTone(660, 80, 0.05, "triangle");
    setTimeout(function() { playTone(988, 100, 0.05, "triangle"); }, 120);
    return;
  }
  if (kind === "complete") {
    playTone(660, 80, 0.05, "triangle");
    setTimeout(function() { playTone(988, 100, 0.05, "triangle"); }, 120);
  }
}

/* ===== TIMER MODAL ===== */
const modal = document.getElementById("timer-modal");
const timerCircle = document.getElementById("timer-circle");
const timerText = document.getElementById("timer-text");
const btnPause = document.getElementById("btn-pause");
const CIRC = 2 * Math.PI * 110; // ~691.15

let timerState = null;
let timerDoneCallback = null;

function openTimerModal(totalSec, doneCallback) {
  requestWakeLock();
  unlockAudio();
  modal.classList.remove("hiding");
  void modal.offsetWidth;
  modal.classList.add("show");
  timerText.classList.remove("blink", "warn");
  timerCircle.classList.remove("blink", "warn");
  btnPause.textContent = "Pausar";
  timerDoneCallback = doneCallback;

  timerState = { total: totalSec, paused: false, startMs: 0, remainingMs: totalSec * 1000, lastBeepSecond: null, endBeeped: false };

  var wrap = document.querySelector(".timer-circle-wrap");
  timerText.style.display = "none";
  timerCircle.style.opacity = "0";
  timerCircle.setAttribute("stroke-dashoffset", "0");
  timerCircle.style.stroke = "#ef4444";

  function showCount(n) {
    if (n <= 0) {
      timerText.style.display = "";
      timerCircle.setAttribute("stroke-dashoffset", String(CIRC));
      void timerCircle.offsetWidth;
      timerCircle.style.transition = "opacity 0.3s var(--ease), stroke-dashoffset 0.5s cubic-bezier(0.22, 1, 0.36, 1)";
      timerCircle.style.opacity = "1";
      timerCircle.setAttribute("stroke-dashoffset", "0");
      setTimeout(function() { runMainTimer(); }, 500);
      return;
    }
    playCue("countdown");
    var el = document.createElement("div");
    el.className = "timer-countdown-text";
    el.style.top = "50%";
    el.style.left = "50%";
    el.style.transform = "translate(-50%, -50%)";
    el.textContent = n;
    el.addEventListener("animationend", function() { this.remove(); });
    wrap.appendChild(el);
    setTimeout(function() { showCount(n - 1); }, 700);
  }
  showCount(3);
}

function runMainTimer() {
  timerState.startMs = Date.now();
  timerState.remainingMs = timerState.total * 1000;
  timerState.paused = false;
  timerState.lastBeepSecond = null;
  timerState.endBeeped = false;
  timerText.classList.remove("blink", "paused");
  timerCircle.classList.remove("blink", "warn");
  btnPause.textContent = "Pausar";
  tick();
}

function tick() {
  if (!timerState || timerState.paused) return;
  var elapsed = Date.now() - timerState.startMs;
  var rem = timerState.remainingMs - elapsed;
  var secs = rem / 1000;
  var total = timerState.total;
  if (rem <= 0) {
    if (!timerState.endBeeped) {
      playCue("end");
      timerState.endBeeped = true;
    }
    timerText.textContent = formatSec(secs);
    timerText.style.color = "var(--neg)";
    timerText.classList.add("blink");
    timerCircle.classList.add("blink");
    requestAnimationFrame(function() { setTimeout(tick, 50); });
    return;
  }
  var remainingSecond = Math.ceil(rem / 1000);
  if (remainingSecond <= 10 && remainingSecond > 0 && remainingSecond !== timerState.lastBeepSecond) {
    timerState.lastBeepSecond = remainingSecond;
    playCue("tick");
  }
  var frac = secs / total;
  var off = CIRC * (1 - frac);
  timerCircle.setAttribute("stroke-dashoffset", String(off));
  var t = Math.max(0, Math.min(1, frac));
  var r = Math.round(239 * t + 56 * (1 - t));
  var g = Math.round(68 * t + 189 * (1 - t));
  var b = Math.round(68 * t + 248 * (1 - t));
  timerCircle.style.stroke = "rgb(" + r + "," + g + "," + b + ")";
  if (secs <= 10) timerCircle.classList.add("warn");
  else timerCircle.classList.remove("warn");
  timerText.style.color = "";
  timerText.classList.remove("paused");
  timerText.textContent = formatSec(secs);
  requestAnimationFrame(function() { setTimeout(tick, 100); });
}

function closeModal(auto) {
  modal.classList.add("hiding");
  setTimeout(function() {
    modal.classList.remove("show", "hiding");
    var cb = timerDoneCallback;
    timerState = null;
    timerDoneCallback = null;
    if (!isWorkoutVisible()) releaseWakeLock();
    if (auto && cb) cb();
  }, 500);
}

/* --- Modal buttons --- */
btnPause.addEventListener("click", function() {
  if (!timerState) return;
  if (timerState.paused) {
    timerState.paused = false;
    timerState.startMs = Date.now();
    timerText.classList.remove("blink", "paused");
    btnPause.textContent = "Pausar";
    tick();
  } else {
    timerState.paused = true;
    timerState.remainingMs -= (Date.now() - timerState.startMs);
    timerText.classList.add("blink");
    timerText.classList.add("paused");
    btnPause.textContent = "Continuar";
    clearTimeout(timerState._blinkTimer);
  }
});

document.getElementById("btn-restart").addEventListener("click", function() {
  if (!timerState) return;
  timerText.classList.remove("blink", "paused");
  timerCircle.classList.remove("blink", "warn");
  runMainTimer();
});

document.getElementById("btn-finish").addEventListener("click", function() {
  closeModal(true);
});

/* ===== REST LINE ===== */
var restLine = document.getElementById("rest-line");
var restTimer = null;

function showRestLine(seconds) {
  clearInterval(restTimer);
  restLine.style.transition = "none";
  restLine.style.width = "100%";
  restLine.classList.add("active");
  restLine.classList.remove("warn");
  void restLine.offsetWidth;
  restLine.style.transition = "width " + seconds + "s linear";
  restLine.style.width = "0%";

  var t = seconds;
  restTimer = setInterval(function() {
    t--;
    if (t <= 10 && t > 0) restLine.classList.add("warn");
    if (t <= 0) {
      clearInterval(restTimer);
      restLine.classList.remove("active", "warn");
      restLine.style.transition = "none";
    }
  }, 1000);
}

function exerciseSideLabel(side) {
  if (side === "E") return "lado esquerdo";
  if (side === "D") return "lado direito";
  return side || "";
}

function renderShortWorkoutVariantPicker(container, variant) {
  var picker = document.createElement("div");
  picker.className = "short-switcher";
  picker.innerHTML =
    '<div class="short-switcher-label">Escolha o treino curto</div>' +
    '<div class="short-switcher-row">' +
      '<button type="button" class="short-switch-btn' + (variant === "a" ? " active" : "") + '" data-short-variant="a">' + shortWorkoutLabels.a + '</button>' +
      '<button type="button" class="short-switch-btn' + (variant === "b" ? " active" : "") + '" data-short-variant="b">' + shortWorkoutLabels.b + '</button>' +
    '</div>' +
    '<div class="short-switch-note">A e B usam o mesmo circuito, mas com distribuição diferente dos exercícios conhecidos.</div>';
  container.appendChild(picker);
}

function setShortWorkoutVariant(variant) {
  if (variant !== "a" && variant !== "b") return;
  var state = getCircuitState("curto");
  if (state.running || state.remainingMs > 0) return;
  if (getShortWorkoutVariant() === variant) return;
  shortWorkoutVariant = variant;
  localStorage.setItem("treino_curto_variant", variant);
  var currentView = document.getElementById("dashboard").classList.contains("visible") ? "dashboard" : "workout";
  renderWorkout("curto");
  bindCircuit("curto");
  setupPersistence("curto");
  showView(currentView, currentView === "workout" ? "curto" : undefined);
}

/* ===== RENDER ===== */
const app = document.getElementById("app");

function renderWorkout(mode) {
  var exercises = getWorkoutExercises(mode);
  var settings = workoutSettings[mode] || {};
  var oldContainer = document.getElementById("workout-" + mode);
  var wasVisible = oldContainer && oldContainer.classList.contains("visible");
  if (oldContainer) oldContainer.remove();
  var container = document.createElement("div");
  container.className = "workout";
  if (wasVisible) container.classList.add("visible");
  container.id = "workout-" + mode;

  if (mode === "curto") {
    renderShortWorkoutVariantPicker(container, getShortWorkoutVariant());
  }

  if (settings.circuit) {
    var timedCount = exercises.filter(function(ex) { return !ex.mobility; }).reduce(function(total, ex) {
      return total + (ex.sides && ex.sides.length ? ex.sides.length : 1);
    }, 0);
    var firstExercise = exercises.filter(function(ex) { return !ex.mobility; })[0];
    var panel = document.createElement("div");
    panel.className = "circuit-panel";
    panel.innerHTML =
      '<div class="circuit-kicker">Circuito intervalado</div>' +
      '<div class="circuit-title">' + getWorkoutLabel(mode) + ' guiado por tempo</div>' +
      '<div class="circuit-meta">' + settings.rounds + ' rodadas · ' + timedCount + ' estações · ' + settings.work + 's trabalho / ' + settings.transition + 's transição</div>' +
      '<button class="circuit-exit" data-circuit-close aria-label="Fechar série">×</button>' +
      '<div class="circuit-display">' +
        '<div class="circuit-info">' +
          '<div class="circuit-phase" data-circuit-phase>Pronto</div>' +
          '<div class="circuit-next" data-circuit-next>Próximo: ' + (firstExercise ? firstExercise.name : "-") + '</div>' +
        '</div>' +
        '<div class="circuit-ring" aria-live="polite">' +
          '<svg class="circuit-circle-svg" viewBox="0 0 240 240" aria-hidden="true">' +
            '<circle class="circuit-circle-bg" cx="120" cy="120" r="110"/>' +
            '<circle class="circuit-circle-fg" data-circuit-circle cx="120" cy="120" r="110" stroke-dasharray="691.15" stroke-dashoffset="691.15"/>' +
          '</svg>' +
          '<div class="circuit-time" data-circuit-time>--</div>' +
        '</div>' +
        '<div class="circuit-current" data-circuit-current>Faça a mobilidade e inicie o circuito.</div>' +
      '</div>' +
      '<div class="circuit-actions">' +
        '<button class="circuit-start" data-circuit-start>Iniciar</button>' +
        '<button class="circuit-reset" data-circuit-reset>Reiniciar</button>' +
        '<button class="circuit-skip" data-circuit-skip>Pular</button>' +
      '</div>';
    container.appendChild(panel);
  }

  exercises.forEach(function(ex, i) {
    var div = document.createElement("div");
    div.className = "exercise";
    div.style.animationDelay = (i * 0.06) + "s";
    var num = i + 1;

    var mobilityHTML = "";
    if (ex.mobility) {
      mobilityHTML = '<ul class="mobility-list">';
      ex.list.forEach(function(e) { mobilityHTML += "<li>" + e + "</li>"; });
      mobilityHTML += "</ul>";
    }

    var seriesHTML = "";
    if (!ex.mobility && !settings.circuit) {
      seriesHTML = '<div class="grid">' +
        '<div class="button-row"><button class="start">Série 1</button></div>' +
        '<div class="button-row"><button class="start">Série 2</button></div>' +
        '<div class="button-row"><button class="start">Série 3</button></div>' +
        '</div>';
    }

    div.innerHTML =
      '<div class="title"><span class="title-badge">' + num + '</span>' + ex.name + '</div>' +
      '<div class="row"><span>Reps:</span><span contenteditable>' + ex.reps + '</span><span>Carga:</span><span contenteditable>' + ex.load + '</span></div>' +
      '<div class="obs" contenteditable>Observações...</div>' +
      mobilityHTML +
      (!ex.mobility ? seriesHTML : "");

    container.appendChild(div);
  });

  app.appendChild(container);

  var finishBtn = document.createElement("button");
  finishBtn.className = "finish-workout";
  finishBtn.textContent = "Concluir treino";
  finishBtn.addEventListener("click", function() { completeWorkout(mode); });
  container.appendChild(finishBtn);

  if (mode === "curto") {
    container.querySelectorAll("[data-short-variant]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        setShortWorkoutVariant(btn.dataset.shortVariant);
      });
    });
  }
}

function bindButtons(mode) {
  var exercises = getWorkoutExercises(mode);
  var settings = workoutSettings[mode] || {};
  if (settings.circuit) return;
  var container = document.getElementById("workout-" + mode);
  container.querySelectorAll(".exercise").forEach(function(box, i) {
    if (exercises[i].mobility) return;
    var starts = box.querySelectorAll(".start");

    starts.forEach(function(btn, idx) {
      btn.addEventListener("click", function() {
        openTimerModal(exercises[i].time, function() {
          btn.disabled = true;
          btn.classList.add("done");
          btn.textContent = "Feito";
          showRestLine(exercises[i].rest);
          var allStarts = container.querySelectorAll(".start");
          var allDone = Array.from(allStarts).every(function(b) { return b.disabled; });
          if (allDone) completeWorkout(mode);
        });
      });
    });
  });
}

var circuitStates = {};

function getCircuitExercises(mode) {
  return getWorkoutExercises(mode).filter(function(ex) { return !ex.mobility; });
}

function buildCircuitSteps(mode) {
  var settings = workoutSettings[mode];
  var exercises = getCircuitExercises(mode);
  var steps = [];
  for (var round = 1; round <= settings.rounds; round++) {
    exercises.forEach(function(ex, idx) {
      var sides = ex.sides && ex.sides.length ? ex.sides : [null];
      sides.forEach(function(side, sideIndex) {
        steps.push({
          type: "work",
          label: ex.name,
          side: side,
          sideIndex: sideIndex,
          seconds: settings.work,
          round: round,
          exerciseIndex: idx
        });
      });
      var isLast = round === settings.rounds && idx === exercises.length - 1;
      if (!isLast) {
        var nextExercise = exercises[(idx + 1) % exercises.length];
        steps.push({
          type: "transition",
          label: "Transição",
          next: nextExercise.name,
          nextSide: nextExercise.sides && nextExercise.sides.length ? nextExercise.sides[0] : null,
          seconds: settings.transition,
          round: round,
          roundEnd: idx === exercises.length - 1,
          exerciseIndex: idx
        });
      }
    });
  }
  return steps;
}

function getCircuitState(mode) {
  var key = getCircuitStateKey(mode);
  if (!circuitStates[key]) {
    circuitStates[key] = {
      mode: mode,
      key: key,
      steps: buildCircuitSteps(mode),
      current: 0,
      running: false,
      remainingMs: 0,
      endMs: 0,
      interval: null,
      complete: false,
      lastBeepSecond: null,
      endBeeped: false,
      _lastUiStepIndex: null,
      _textTimer: null,
      _textLockedUntil: 0
    };
  }
  return circuitStates[key];
}

function setCircuitPhase(state, index) {
  state.current = index;
  state.remainingMs = state.steps[index].seconds * 1000;
  state.endMs = Date.now() + state.remainingMs;
  state.complete = false;
  state.lastBeepSecond = null;
  state.endBeeped = false;
  updateCircuitPanel(state.mode);
}

function beginCircuit(mode) {
  requestWakeLock();
  unlockAudio();
  var state = getCircuitState(mode);
  if (state.complete || state.current >= state.steps.length) {
    resetCircuit(mode);
    state = getCircuitState(mode);
  }
  if (state.remainingMs <= 0) setCircuitPhase(state, state.current);
  state.running = true;
  state.endMs = Date.now() + state.remainingMs;
  clearInterval(state.interval);
  state.interval = setInterval(function() { tickCircuit(mode); }, 100);
  updateCircuitPanel(mode);
}

function startCircuit(mode) {
  var settings = workoutSettings[mode] || {};
  var state = getCircuitState(mode);
  if (state.running) {
    pauseCircuit(mode);
    return;
  }
  if (state.remainingMs > 0) {
    beginCircuit(mode);
    return;
  }
  if (settings.countdown && !state.complete) {
    openTimerModal(settings.countdown, function() {
      beginCircuit(mode);
    });
    return;
  }
  beginCircuit(mode);
}

function pauseCircuit(mode) {
  var state = getCircuitState(mode);
  if (!state.running) return;
  state.remainingMs = Math.max(0, state.endMs - Date.now());
  state.running = false;
  clearInterval(state.interval);
  updateCircuitPanel(mode);
}

function tickCircuit(mode) {
  var state = getCircuitState(mode);
  if (!state.running) return;
  state.remainingMs = state.endMs - Date.now();
  if (state.remainingMs <= 0) {
    if (!state.endBeeped) {
      playCue("end");
      state.endBeeped = true;
    }
    nextCircuitStep(mode);
    return;
  }
  var remainingSecond = Math.ceil(state.remainingMs / 1000);
  if (remainingSecond <= 10 && remainingSecond > 0 && remainingSecond !== state.lastBeepSecond) {
    state.lastBeepSecond = remainingSecond;
    playCue("tick");
  }
  updateCircuitPanel(mode);
}

function nextCircuitStep(mode) {
  var state = getCircuitState(mode);
  if (!state.running && state.remainingMs <= 0 && state.current === 0 && !state.complete) return;
  if (state.current >= state.steps.length - 1) {
    finishCircuit(mode);
    return;
  }
  setCircuitPhase(state, state.current + 1);
  if (state.running) {
    state.endMs = Date.now() + state.remainingMs;
  }
  updateCircuitPanel(mode);
}

function restartCircuit(mode) {
  resetCircuit(mode);
  startCircuit(mode);
}

function finishCircuit(mode) {
  var state = getCircuitState(mode);
  clearInterval(state.interval);
  state.running = false;
  state.complete = true;
  state.remainingMs = 0;
  releaseWakeLock();
  playCue("complete");
  updateCircuitPanel(mode);
  completeWorkout(mode);
}

function resetCircuit(mode) {
  var state = getCircuitState(mode);
  clearInterval(state.interval);
  releaseWakeLock();
  circuitStates[state.key] = {
    mode: mode,
    key: state.key,
    steps: buildCircuitSteps(mode),
    current: 0,
    running: false,
    remainingMs: 0,
    endMs: 0,
    interval: null,
    complete: false,
    lastBeepSecond: null,
    endBeeped: false,
    _lastUiStepIndex: null,
    _textTimer: null,
    _textLockedUntil: 0
  };
  updateCircuitPanel(mode);
}

function animateCircuitTexts(state, panel, phaseEl, currentEl, nextEl, phaseText, currentText, nextText) {
  clearTimeout(state._textTimer);
  panel.classList.remove("step-enter");
  panel.classList.add("step-leave");
  state._textLockedUntil = Date.now() + 150;
  state._textTimer = setTimeout(function() {
    phaseEl.textContent = phaseText;
    currentEl.textContent = currentText;
    nextEl.textContent = nextText;
    panel.classList.remove("step-leave");
    panel.classList.add("step-enter");
    requestAnimationFrame(function() {
      panel.classList.remove("step-enter");
    });
    state._textLockedUntil = 0;
  }, 150);
}

function updateCircuitPanel(mode) {
  var container = document.getElementById("workout-" + mode);
  if (!container) return;
  var state = getCircuitState(mode);
  var step = state.steps[state.current];
  var panel = container.querySelector(".circuit-panel");
  var timeEl = container.querySelector("[data-circuit-time]");
  var circleEl = container.querySelector("[data-circuit-circle]");
  var phaseEl = container.querySelector("[data-circuit-phase]");
  var currentEl = container.querySelector("[data-circuit-current]");
  var nextEl = container.querySelector("[data-circuit-next]");
  var startBtn = container.querySelector("[data-circuit-start]");
  var restartBtn = container.querySelector("[data-circuit-reset]");
  var skipBtn = container.querySelector("[data-circuit-skip]");
  var closeBtn = container.querySelector("[data-circuit-close]");
  if (!panel || !timeEl || !circleEl || !phaseEl || !currentEl || !nextEl || !startBtn || !restartBtn || !skipBtn || !closeBtn) return;

  var active = state.running || state.remainingMs > 0;
  panel.classList.toggle("active", active);

  var seconds = Math.ceil(Math.max(0, state.remainingMs) / 1000);
  timeEl.textContent = state.remainingMs > 0 ? formatSec(seconds) : "--";
  timeEl.classList.toggle("paused", !state.running && state.remainingMs > 0 && !state.complete);
  timeEl.classList.toggle("warn", state.running && seconds <= 10);
  circleEl.classList.toggle("warn", state.running && seconds <= 10);

  var totalMs = step.seconds * 1000;
  var phaseIsTransition = step.type === "transition";
  var frac = state.remainingMs > 0
    ? (phaseIsTransition
      ? 1 - Math.max(0, Math.min(1, state.remainingMs / totalMs))
      : Math.max(0, Math.min(1, state.remainingMs / totalMs)))
    : (phaseIsTransition ? 1 : 0);
  var off = CIRC * (1 - frac);
  circleEl.setAttribute("stroke-dashoffset", String(off));
  var t = Math.max(0, Math.min(1, frac));
  var r = Math.round(239 * t + 56 * (1 - t));
  var g = Math.round(68 * t + 189 * (1 - t));
  var b = Math.round(68 * t + 248 * (1 - t));
  circleEl.style.stroke = state.complete ? "#22c55e" : "rgb(" + r + "," + g + "," + b + ")";

  if (state.complete) {
    phaseEl.textContent = "Concluído";
    currentEl.textContent = "Circuito curto registrado.";
    nextEl.textContent = "Use Reiniciar para repetir ou Fechar série para sair.";
    startBtn.textContent = "Iniciar";
    restartBtn.textContent = "Reiniciar";
    skipBtn.textContent = "Pular";
    closeBtn.textContent = "×";
    return;
  }

  var phaseText = step.type === "work" ? "Rodada " + step.round + " · Trabalho" : "Rodada " + step.round + " · Transição";
  var currentText = step.type === "work"
    ? step.label + (step.side ? " · " + exerciseSideLabel(step.side) : "")
    : "Prepare: " + step.next + (step.nextSide ? " · " + exerciseSideLabel(step.nextSide) : "");
  var nextStep = state.steps[state.current + 1];
  var nextText = nextStep
    ? "Próximo: " + (nextStep.type === "work"
      ? nextStep.label + (nextStep.side ? " · " + exerciseSideLabel(nextStep.side) : "")
      : (nextStep.roundEnd ? "fim da rodada" : "transição"))
    : "Última estação";
  if (state._lastUiStepIndex !== state.current && !state._textLockedUntil) {
    state._lastUiStepIndex = state.current;
    animateCircuitTexts(state, panel, phaseEl, currentEl, nextEl, phaseText, currentText, nextText);
  } else if (!state._textLockedUntil) {
    phaseEl.textContent = phaseText;
    currentEl.textContent = currentText;
    nextEl.textContent = nextText;
  }
  startBtn.textContent = state.running ? "Pausar" : (state.remainingMs > 0 ? "Continuar" : "Iniciar");
  restartBtn.textContent = "Reiniciar";
  skipBtn.textContent = "Pular";
  closeBtn.textContent = "×";
}

function bindCircuit(mode) {
  if (!(workoutSettings[mode] || {}).circuit) return;
  var container = document.getElementById("workout-" + mode);
  container.querySelector("[data-circuit-start]").addEventListener("click", function() {
    startCircuit(mode);
  });
  container.querySelector("[data-circuit-reset]").addEventListener("click", function() { restartCircuit(mode); });
  container.querySelector("[data-circuit-skip]").addEventListener("click", function() { nextCircuitStep(mode); });
  container.querySelector("[data-circuit-close]").addEventListener("click", function() { resetCircuit(mode); });
  updateCircuitPanel(mode);
}

function setupPersistence(mode) {
  var container = document.getElementById("workout-" + mode);
  container.querySelectorAll(".exercise").forEach(function(box, i) {
    var spans = box.querySelectorAll("span[contenteditable]");
    if (!spans[0] || !spans[1]) return;
    var repsEl = spans[0], loadEl = spans[1];
    var obsEl = box.querySelector(".obs[contenteditable]");
    if (!obsEl) return;
    var storageMode = getWorkoutStorageMode(mode);
    var prefix = "treino_" + storageMode + "_";
    var legacyIndex = mode === "longo" ? [0, 1, 2, 3, 6, 7, 8, 9][i] : i;
    var legacyPrefixes = mode === "longo" ? ["treino_", "treinoA_"] : (storageMode === "curto_a" ? ["treino_curto_"] : []);
    var savedReps = localStorage.getItem(prefix + "reps_" + i);
    var savedLoad = localStorage.getItem(prefix + "load_" + i);
    var savedObs = localStorage.getItem(prefix + "obs_" + i);
    legacyPrefixes.some(function(legacyPrefix) {
      if (savedReps === null) savedReps = localStorage.getItem(legacyPrefix + "reps_" + legacyIndex);
      if (savedLoad === null) savedLoad = localStorage.getItem(legacyPrefix + "load_" + legacyIndex);
      if (savedObs === null) savedObs = localStorage.getItem(legacyPrefix + "obs_" + legacyIndex);
      return savedReps !== null && savedLoad !== null && savedObs !== null;
    });
    if (savedReps !== null) repsEl.textContent = savedReps;
    if (savedLoad !== null) loadEl.textContent = savedLoad;
    if (savedObs !== null) obsEl.textContent = savedObs;
    repsEl.addEventListener("input", function() { localStorage.setItem(prefix + "reps_" + i, repsEl.textContent); });
    loadEl.addEventListener("input", function() { localStorage.setItem(prefix + "load_" + i, loadEl.textContent); });
    obsEl.addEventListener("input", function() { localStorage.setItem(prefix + "obs_" + i, obsEl.textContent); });
  });
}

function logWorkout(mode) {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");
  var today = new Date().toISOString().slice(0, 10);
  var entry = { date: today, type: mode, completedAt: new Date().toISOString() };
  var idx = log.findIndex(function(e) { return e.date === today; });
  if (idx >= 0) log[idx] = entry; else log.push(entry);
  localStorage.setItem("treino_log", JSON.stringify(log));
}

function completeWorkout(mode) {
  releaseWakeLock();
  logWorkout(mode);
  showCelebration();
  renderDashboard();
}

function showCelebration() {
  var el = document.getElementById("celebrate");
  if (!el) return;
  spawnConfetti(el);
  el.classList.add("show");
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.classList.remove("show"); }, 5000);
  el.onclick = function() { el.classList.remove("show"); };
}

function spawnConfetti(container) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var colors = ["#22c55e", "#38bdf8", "#f59e0b", "#e5e7eb"];
  for (var n = 0; n < 28; n++) {
    var c = document.createElement("div");
    c.className = "confetti";
    c.style.left = (Math.random() * 100) + "%";
    c.style.background = colors[n % colors.length];
    c.style.width = (6 + Math.random() * 4) + "px";
    c.style.height = (9 + Math.random() * 5) + "px";
    c.style.setProperty("--cf-dur", (2 + Math.random() * 1.4) + "s");
    c.style.animationDelay = (Math.random() * 0.5) + "s";
    container.appendChild(c);
    c.addEventListener("animationend", function() { this.remove(); });
  }
}

function exportHistory() {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");
  if (log.length === 0) return;
  var csv = "date,type,completedAt\n" + log.map(function(e) { return e.date + "," + e.type + "," + e.completedAt; }).join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "treino_log.csv";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function readHistory() {
  return JSON.parse(localStorage.getItem("treino_log") || "[]");
}

function displayType(type) {
  if (type === "A") return "longo";
  if (type === "B") return "curto";
  return type;
}

function renderDashboard() {
  var log = readHistory();
  var normalized = log.map(function(entry) {
    return { date: entry.date, type: displayType(entry.type), completedAt: entry.completedAt };
  });
  var last = normalized[normalized.length - 1];
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - i);
    var date = d.toISOString().slice(0, 10);
    days.push({ date: date, done: normalized.some(function(entry) { return entry.date === date; }) });
  }
  var dash = document.getElementById("dashboard");
  dash.innerHTML =
    '<div class="dash-grid">' +
      '<div class="dash-card"><div class="dash-card-title">Total de treinos</div><div class="dash-value">' + normalized.length + '</div></div>' +
      '<div class="dash-card"><div class="dash-card-title">Último treino</div><div class="dash-value">' + (last ? last.type : "-") + '</div></div>' +
    '</div>' +
    '<div class="dash-card"><div class="dash-card-title">Últimos 7 dias</div><div class="dash-days">' +
      days.map(function(day) {
        var label = new Date(day.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short" }).slice(0, 3);
        return '<div class="dash-day">' + label + '<div class="dash-dot' + (day.done ? ' done' : '') + '">' + (day.done ? '✓' : '·') + '</div></div>';
      }).join("") +
    '</div></div>' +
    '<div class="dash-card"><div class="dash-card-title">Distribuição</div><div>Curto: ' + normalized.filter(function(e) { return e.type === "curto"; }).length + '</div><div>Longo: ' + normalized.filter(function(e) { return e.type === "longo"; }).length + '</div></div>' +
    '<button class="dash-actions" id="btn-export-history">Exportar histórico (CSV)</button>';
  document.getElementById("btn-export-history").addEventListener("click", exportHistory);
}

function showView(view, mode) {
  document.querySelectorAll(".tab-btn").forEach(function(btn) {
    btn.classList.toggle("active", btn.dataset.view === view && (view === "dashboard" || btn.dataset.mode === mode));
  });
  document.querySelectorAll(".workout").forEach(function(container) {
    container.classList.toggle("visible", view === "workout" && container.id === "workout-" + mode);
  });
  document.getElementById("dashboard").classList.toggle("visible", view === "dashboard");
  if (view === "dashboard") {
    releaseWakeLock();
  } else if (view === "workout") {
    requestWakeLock();
  }
  if (view === "dashboard") renderDashboard();
  if (view === "workout") localStorage.setItem("treino_selected", mode);
}

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible" && isWorkoutVisible()) {
    requestWakeLock();
  }
});

renderWorkout("curto");
renderWorkout("longo");
bindButtons("curto");
bindButtons("longo");
bindCircuit("curto");
setupPersistence("curto");
setupPersistence("longo");
document.querySelectorAll(".tab-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    showView(btn.dataset.view, btn.dataset.mode);
  });
});
renderDashboard();
showView("dashboard");
</script>
</body>
</html>
