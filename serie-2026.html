<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card: #0f1a2e;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --neg: #ef4444;
      --tab: #1e293b;
      --accent: #f59e0b;
      --border: #1e293b;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }
    .header { text-align: center; padding: 4px 0 2px 0; }
    #logo {
      width: 128px; height: auto;
      transition: width 0.3s ease, transform 0.3s ease;
      border-radius: 12px; display: inline-block;
    }
    .header--dash #logo { width: 176px; height: auto; }

    .exercise {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
      animation: cardIn 0.5s var(--ease) backwards;
    }
    @media (hover: hover) {
      .exercise:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .title {
      font-size: 1.3em; font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em;
    }
    .title-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 28px; border-radius: 50%;
      background: #22c55e; color: black; font-size: 0.75em;
      font-weight: 700; flex-shrink: 0;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .row span { background: #020617; padding: 4px 10px; border-radius: 6px; font-size: 0.9em; }
    .row span[contenteditable] { border-bottom: 1px dashed var(--muted); min-width: 50px; }
    .obs {
      background: #020617; padding: 8px 10px; border-radius: 8px;
      font-size: 0.85em; margin-bottom: 10px; color: var(--muted);
    }
    .obs[contenteditable] { border: 1px dashed var(--border); }
    .obs[contenteditable]:focus { color: var(--text); border-color: var(--muted); }
    .mobility-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .mobility-list li { background: #020617; padding: 8px 12px; border-radius: 8px; font-size: 0.9em; }
    .mobility-list li::before { content: "○ "; color: var(--muted); }
    .grid { display: grid; grid-template-rows: auto repeat(3, auto); gap: 8px; }
    .button-row { display: flex; gap: 8px; }

    button {
      flex: 1; padding: 10px; border-radius: 10px; border: none;
      font-family: inherit; font-weight: 600; font-size: 0.9em;
      color: black; min-width: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: transform 0.12s, box-shadow 0.12s, filter 0.15s;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (hover: hover) {
      button:not(.done):hover { filter: brightness(1.07); }
    }
    .start { background: #22c55e; }
    .finish { background: #38bdf8; }
    .done {
      opacity: 0.4; background: #64748b; cursor: default; box-shadow: none;
    }
    .done:active { transform: none; box-shadow: none; }
    .blink { animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .timer {
      font-size: 3em; font-weight: 700; text-align: center; padding: 12px 0;
      margin-bottom: 10px; background: #020617; border-radius: 12px;
      letter-spacing: 0.05em; color: var(--muted);
      transition: color 0.3s var(--ease), transform 0.2s var(--ease), box-shadow 0.3s var(--ease);
    }
    .timer-start { animation: timerPulse 0.45s var(--ease); }
    @keyframes timerPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245,158,11,0); }
      40% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(245,158,11,0.22); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245,158,11,0); }
    }

    .screen { display: none; }
    .screen.visible { display: block; animation: fadeIn 0.35s ease; }
    .workout { display: none; }
    .workout.visible { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .dash-grid { display: grid; gap: 12px; }
    .dash-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .dash-card-title {
      font-size: 0.8em; color: var(--muted); margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .dash-card-value { font-size: 2em; font-weight: 700; }
    .dash-card-sub { font-size: 0.9em; color: var(--muted); margin-top: 2px; }
    .dash-week { display: flex; gap: 8px; margin-top: 8px; }
    .dash-day { flex: 1; text-align: center; }
    .dash-day-label { font-size: 0.65em; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    .dash-day-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%; font-size: 0.85em; transition: background 0.2s;
    }
    .dash-day-dot.on { background: #22c55e; color: black; }
    .dash-day-dot.off { background: #1e293b; color: var(--muted); }

    .btn-export {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      font-weight: 600; font-size: 0.95em; cursor: pointer; margin-top: 4px;
      transition: background 0.15s, color 0.15s; box-shadow: none;
    }
    .btn-export:active { transform: scale(0.97); }
    .btn-export:hover { background: var(--tab); color: var(--text); }

    .finish-workout {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: #22c55e; color: black; font-weight: 700; font-size: 1.1em;
      cursor: pointer; margin-top: 6px; box-shadow: 0 2px 8px rgba(34,197,94,0.3);
    }
    .finish-workout:active { transform: scale(0.97); }

    /* Comemoracao de treino concluido (tela inteira) */
    .celebrate {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      background: rgba(11, 17, 32, 0.86);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      text-align: center; padding: 24px;
    }
    .celebrate.show { display: flex; animation: fadeIn 0.4s var(--ease); }
    .celebrate-inner { position: relative; padding: 28px 24px; animation: celebratePop 0.5s var(--ease) both; }
    @keyframes celebratePop {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .celebrate-ring {
      width: 96px; height: 96px; margin: 0 auto 18px;
      border-radius: 50%; display: grid; place-items: center;
      background: rgba(34, 197, 94, 0.12); position: relative;
    }
    .celebrate-ring::before {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 2px solid rgba(34, 197, 94, 0.45);
      animation: ringExpand 1.1s var(--ease) infinite;
    }
    .celebrate-ring::after {
      content: ""; position: absolute; inset: -22px; border-radius: 50%;
      border: 2px solid rgba(34, 197, 94, 0.22);
      animation: ringExpand 1.1s var(--ease) infinite 0.35s;
    }
    @keyframes ringExpand {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .celebrate-check { width: 46px; height: 46px; }
    .celebrate-check path {
      stroke: #22c55e; stroke-width: 6; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 48; stroke-dashoffset: 48;
      animation: drawCheck 0.5s var(--ease) 0.15s forwards;
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
    .celebrate-title { font-size: 1.6em; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .celebrate-sub { font-size: 0.95em; color: var(--muted); }
    .confetti {
      position: fixed; top: -12px; border-radius: 2px; opacity: 0;
      animation: confettiFall var(--cf-dur, 2.4s) linear forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(105vh) rotate(540deg); }
    }

    /* Acessibilidade: reduz movimento para quem preferir */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .celebrate-check path { stroke-dashoffset: 0 !important; }
    }
  </style>
</head>
<body>

<div id="header" class="header header--dash">
  <img src="image.png" alt="Treino" id="logo">
</div>

<div id="app"></div>
<div id="screen-dashboard" class="screen"></div>
<div id="celebrate" class="celebrate" role="alertdialog" aria-label="Treino concluído">
  <div class="celebrate-inner">
    <div class="celebrate-ring">
      <svg class="celebrate-check" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M14 27 L23 36 L39 18" />
      </svg>
    </div>
    <div class="celebrate-title">Treino concluído!</div>
    <div class="celebrate-sub">Você mandou bem. Até a próxima.</div>
  </div>
</div>

<script>
const exercises = [
  { name:"Mobilidade", reps:"Sequencia", load:"0 kg", mobility:true, list:["Floppy arm - 10","Cat/cow - 10","Best stretch - 10"] },
  { name:"Pallof Press", reps:"10-12 / lado", load:"elastico", time:40, rest:30 },
  { name:"Agachamento unilateral", reps:"12", load:"5 kg", time:40, rest:30 },
  { name:"Flexao de braco", reps:"8-12", load:"peso corporal", time:40, rest:30 },
  { name:"Rotacao externa do antebraco", reps:"10", load:"4 kg", time:40, rest:30 },
  { name:"Sleeper Stretch", reps:"1", load:"0 kg", mobility:true, list:[] },
  { name:"Barra fixa", reps:"4 / 3 / 2", load:"peso corporal", time:40, rest:30 },
  { name:"Remada", reps:"10-12", load:"kettlebell 12 kg", time:40, rest:30 },
  { name:"Levantamento terra KB", reps:"12", load:"15 kg", time:40, rest:30 },
  { name:"Hanging Knee Raise", reps:"8-12", load:"peso corporal", time:40, rest:30 }
];

let currentTimer = null;

function startCountdown(seconds, display, btn) {
  clearInterval(currentTimer);
  document.querySelectorAll(".blink").forEach(b => b.classList.remove("blink"));
  btn.classList.add("blink");
  display.classList.remove("timer-start");
  void display.offsetWidth;
  display.classList.add("timer-start");
  display.style.color = window.getComputedStyle(btn).backgroundColor;
  let t = seconds;
  display.textContent = format(t);
  currentTimer = setInterval(() => {
    t--;
    display.textContent = format(t);
    if (t < 0) display.style.color = "var(--neg)";
  }, 1000);
}

function format(s) {
  const sign = s < 0 ? "-" : "";
  s = Math.abs(s);
  return sign + "0:" + s.toString().padStart(2, "0");
}

const app = document.getElementById("app");

function renderWorkout() {
  const container = document.createElement("div");
  container.className = "workout visible";
  container.id = "workout";

  exercises.forEach(function(ex, i) {
    var div = document.createElement("div");
    div.className = "exercise";
    div.style.animationDelay = (i * 0.06) + "s";
    var num = i + 1;

    var mobilityHTML = "";
    if (ex.mobility) {
      mobilityHTML = '<ul class="mobility-list">';
      ex.list.forEach(function(e) { mobilityHTML += "<li>" + e + "</li>"; });
      mobilityHTML += "</ul>";
    }

    var seriesHTML = "";
    if (!ex.mobility) {
      seriesHTML =
        '<div class="timer" id="timer' + i + '">0:00</div>' +
        '<div class="button-row"><button class="start">Serie 1</button><button class="finish">Descanso</button></div>' +
        '<div class="button-row"><button class="start">Serie 2</button><button class="finish">Descanso</button></div>' +
        '<div class="button-row"><button class="start">Serie 3</button><button class="finish">Descanso</button></div>';
    }

    div.innerHTML =
      '<div class="title"><span class="title-badge">' + num + '</span>' + ex.name + '</div>' +
      '<div class="row"><span>Reps:</span><span contenteditable>' + ex.reps + '</span><span>Carga:</span><span contenteditable>' + ex.load + '</span></div>' +
      '<div class="obs" contenteditable>Observacoes...</div>' +
      mobilityHTML +
      (!ex.mobility ? '<div class="grid">' + seriesHTML + '</div>' : "");

    container.appendChild(div);
  });

  app.appendChild(container);

  var finishBtn = document.createElement("button");
  finishBtn.className = "finish-workout";
  finishBtn.textContent = "Concluir treino";
  finishBtn.addEventListener("click", completeWorkout);
  container.appendChild(finishBtn);
}

function bindButtons() {
  var container = document.getElementById("workout");
  container.querySelectorAll(".exercise").forEach(function(box, i) {
    if (exercises[i].mobility) return;
    var timer = box.querySelector(".timer");
    var starts = box.querySelectorAll(".start");
    var finishes = box.querySelectorAll(".finish");
    starts.forEach(function(btn, idx) {
      btn.addEventListener("click", function() { startCountdown(exercises[i].time, timer, btn); });
    });
    finishes.forEach(function(btn, idx) {
      btn.addEventListener("click", function() {
        startCountdown(exercises[i].rest, timer, btn);
        var startBtn = starts[idx];
        startBtn.disabled = true;
        startBtn.classList.add("done");
        startBtn.textContent = "Feito";
        var allStarts = container.querySelectorAll(".start");
        var allDone = Array.from(allStarts).every(function(b) { return b.disabled; });
        if (allDone) completeWorkout();
      });
    });
  });
}

function setupPersistence() {
  var container = document.getElementById("workout");
  container.querySelectorAll(".exercise").forEach(function(box, i) {
    var spans = box.querySelectorAll("span[contenteditable]");
    if (!spans[0] || !spans[1]) return;
    var repsEl = spans[0], loadEl = spans[1];
    var obsEl = box.querySelector(".obs[contenteditable]");
    if (!obsEl) return;
    var prefix = "treino_";
    var savedReps = localStorage.getItem(prefix + "reps_" + i);
    var savedLoad = localStorage.getItem(prefix + "load_" + i);
    var savedObs = localStorage.getItem(prefix + "obs_" + i);
    if (savedReps !== null) repsEl.textContent = savedReps;
    if (savedLoad !== null) loadEl.textContent = savedLoad;
    if (savedObs !== null) obsEl.textContent = savedObs;
    repsEl.addEventListener("input", function() { localStorage.setItem(prefix + "reps_" + i, repsEl.textContent); });
    loadEl.addEventListener("input", function() { localStorage.setItem(prefix + "load_" + i, loadEl.textContent); });
    obsEl.addEventListener("input", function() { localStorage.setItem(prefix + "obs_" + i, obsEl.textContent); });
  });
}

function logWorkout() {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");
  var today = new Date().toISOString().slice(0, 10);
  var entry = { date: today, type: "A", completedAt: new Date().toISOString() };
  var idx = log.findIndex(function(e) { return e.date === today; });
  if (idx >= 0) log[idx] = entry; else log.push(entry);
  localStorage.setItem("treino_log", JSON.stringify(log));
}

function completeWorkout() {
  logWorkout();
  showCelebration();
}

function showCelebration() {
  var el = document.getElementById("celebrate");
  if (!el) return;
  spawnConfetti(el);
  el.classList.add("show");
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function() { el.classList.remove("show"); }, 5000);
  el.onclick = function() { el.classList.remove("show"); };
}

function spawnConfetti(container) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var colors = ["#22c55e", "#38bdf8", "#f59e0b", "#e5e7eb"];
  for (var n = 0; n < 28; n++) {
    var c = document.createElement("div");
    c.className = "confetti";
    c.style.left = (Math.random() * 100) + "%";
    c.style.background = colors[n % colors.length];
    c.style.width = (6 + Math.random() * 4) + "px";
    c.style.height = (9 + Math.random() * 5) + "px";
    var dur = 2 + Math.random() * 1.4;
    c.style.setProperty("--cf-dur", dur + "s");
    c.style.animationDelay = (Math.random() * 0.5) + "s";
    container.appendChild(c);
    c.addEventListener("animationend", function() { this.remove(); });
  }
}

function exportHistory() {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");
  if (log.length === 0) return;
  var csv = "date,type,completedAt\n" + log.map(function(e) { return e.date + "," + e.type + "," + e.completedAt; }).join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "treino_log.csv";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

renderWorkout();
bindButtons();
setupPersistence();
</script>
</body>
</html>
