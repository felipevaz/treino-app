<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treino App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0F1115;
  --bg-card: #1A1D24;
  --bg-card-hover: #22262E;
  --text-primary: #FFFFFF;
  --text-secondary: #8B8F98;
  --accent-primary: #2E7BFF;
  --accent-success: #34D399;
  --accent-warning: #F59E0B;
  --border-color: #2D3139;
  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-card: 0 4px 20px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  padding-bottom: 100px;
}

/* ── Navigation Tabs ── */
.nav-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,17,21,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; padding: 12px 20px; gap: 8px;
}
.nav-logo {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  object-fit: contain; margin-right: 4px;
  flex-shrink: 0;
}
.nav-tabs { display: flex; gap: 4px; flex: 1; justify-content: flex-end; }
.nav-tab {
  padding: 8px 18px; border-radius: var(--radius-sm); border: none;
  background: transparent; color: var(--text-secondary); font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.2s ease;
}
.nav-tab:active { transform: scale(0.96); }
.nav-tab.active {
  background: var(--accent-primary); color: white;
}

/* ── Screens ── */
.screen { display: none; }
.screen.visible { display: block; animation: fadeSlideIn 0.3s ease; }
.workout { display: none; }
.workout.visible { display: block; animation: fadeSlideIn 0.3s ease; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Dashboard ── */
.dash-header {
  text-align: center; padding: 32px 20px 20px;
}
.dash-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.dash-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.dash-grid { display: grid; gap: 12px; padding: 0 20px 20px; }
.dash-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 20px;
}
.dash-card-title {
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
}
.dash-card-value { font-size: 28px; font-weight: 700; }
.dash-card-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

.dash-workout-grid { display: grid; gap: 12px; }
.dash-workout-btn {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 20px; cursor: pointer;
  transition: transform 0.12s, background 0.15s;
}
.dash-workout-btn:active { transform: scale(0.98); background: var(--bg-card-hover); }
.dash-workout-label { font-size: 18px; font-weight: 700; }
.dash-workout-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

.dash-week { display: flex; gap: 8px; margin-top: 10px; }
.dash-day { flex: 1; text-align: center; }
.dash-day-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.dash-day-dot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 14px; font-weight: 700; transition: all 0.2s;
}
.dash-day-dot.on { background: var(--accent-success); color: var(--bg-main); }
.dash-day-dot.off { background: var(--border-color); color: var(--text-secondary); }

.dash-dist { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.dash-dist-row { display: flex; justify-content: space-between; font-size: 14px; }
.dash-dist-row span:last-child { font-weight: 700; }
.dash-bar {
  display: flex; height: 8px; border-radius: 4px; overflow: hidden;
  background: var(--border-color); margin-top: 6px;
}
.dash-bar-a { background: var(--accent-success); transition: width 0.4s ease; }
.dash-bar-b { background: var(--accent-primary); transition: width 0.4s ease; }

.btn-export {
  width: 100%; padding: 14px; border-radius: var(--radius-md);
  border: 1px solid var(--border-color); background: transparent;
  color: var(--text-secondary); font-family: 'Inter', sans-serif;
  font-weight: 600; font-size: 14px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-export:active { transform: scale(0.98); }
.btn-export:hover { background: var(--bg-card-hover); color: var(--text-primary); }

/* ── Workout Header ── */
.workout-header {
  padding: 20px 20px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.workout-header-left { display: flex; align-items: center; gap: 12px; }
.workout-header h1 {
  font-size: 24px; font-weight: 800; letter-spacing: -0.3px;
}
.workout-header .workout-sub {
  color: var(--text-secondary); font-size: 13px; margin-top: 2px;
}
.progress-ring-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
.progress-ring-wrap svg { transform: rotate(-90deg); }
.progress-ring-bg { fill: none; stroke: var(--border-color); stroke-width: 3; }
.progress-ring-fg { fill: none; stroke: var(--accent-success); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
.progress-ring-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: var(--text-primary);
}

/* ── Exercise Card ── */
.exercise-card {
  background: var(--bg-card);
  margin: 12px 20px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.card-header {
  padding: 18px 20px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border-color);
}
.exercise-info h2 { font-size: 17px; font-weight: 700; }
.exercise-info .exercise-meta {
  font-size: 12px; color: var(--text-secondary);
  display: block; margin-top: 3px;
}
.video-btn {
  background: rgba(255,255,255,0.08);
  border: none; color: white;
  width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s; flex-shrink: 0;
}
.video-btn:hover { background: rgba(255,255,255,0.15); }
.video-btn:active { transform: scale(0.92); }

/* ── Timer Display ── */
.timer-bar {
  background: var(--bg-main);
  margin: 0 20px 4px;
  border-radius: var(--radius-md);
  padding: 14px;
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 0.04em;
  min-height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all 0.3s ease;
}
.timer-bar.idle { color: var(--text-secondary); font-size: 15px; font-weight: 500; }
.timer-bar.running { color: var(--accent-success); }
.timer-bar.rest { color: var(--accent-primary); }
.timer-bar .timer-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

/* ── Sets Container ── */
.sets-container { padding: 4px 20px 18px; }
.set-row {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 40px;
  gap: 10px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.set-row:last-child { border-bottom: none; }
.set-index {
  color: var(--text-secondary);
  font-weight: 600; font-size: 13px;
  text-align: center;
}
.input-set {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  width: 100%;
  -webkit-appearance: none;
  outline: none;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s;
}
.input-set:focus { border-color: var(--accent-primary); }
.input-set::placeholder { color: var(--text-secondary); font-weight: 400; font-size: 12px; }

.check-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--border-color);
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: 15px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
  justify-self: end;
  flex-shrink: 0;
}
.check-btn.completed {
  background: var(--accent-success);
  border-color: var(--accent-success);
  color: var(--bg-main);
}
.check-btn:active { transform: scale(0.88); }

/* ── Mobility ── */
.mobility-list { list-style: none; padding: 0 20px 18px; display: flex; flex-direction: column; gap: 6px; }
.mobility-list li {
  background: var(--bg-main); padding: 10px 14px;
  border-radius: var(--radius-sm); font-size: 14px;
  color: var(--text-secondary);
}
.mobility-list li::before { content: "○ "; color: var(--text-secondary); }

/* ── Floating Action Bar ── */
.action-bar {
  position: fixed; bottom: 0; left: 0; width: 100%;
  background: rgba(15,17,21,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 14px 20px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border-color);
  z-index: 50;
}
.finish-btn {
  width: 100%;
  background: var(--accent-primary);
  color: white;
  border: none;
  padding: 16px;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
}
.finish-btn:active { transform: scale(0.97); }
.finish-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

/* ── Success Banner ── */
.banner {
  display: none; position: fixed; bottom: 90px; left: 20px; right: 20px;
  background: var(--accent-success); color: var(--bg-main);
  font-weight: 700; font-size: 16px;
  padding: 18px; border-radius: var(--radius-lg);
  text-align: center; z-index: 60;
  box-shadow: 0 6px 30px rgba(52,211,153,0.35);
}
.banner.show { display: block; animation: fadeSlideIn 0.3s ease; }
.banner .btn-dash {
  display: inline-block; margin-top: 10px; padding: 8px 24px;
  border-radius: var(--radius-sm); border: none;
  background: var(--bg-main); color: var(--accent-success);
  font-weight: 700; font-size: 14px; font-family: 'Inter', sans-serif;
  cursor: pointer;
}

/* ── Misc ── */
.station-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent-success); color: var(--bg-main);
  font-weight: 800; font-size: 15px; flex-shrink: 0;
}
.station-badge-lg { width: 48px; height: 48px; font-size: 20px; }

/* ── Responsive ── */
@media (min-width: 600px) {
  .exercise-card, .dash-grid, .dash-workout-grid { max-width: 500px; margin-left: auto; margin-right: auto; }
  .dash-header { max-width: 500px; margin: 0 auto; }
  .workout-header { max-width: 540px; margin: 0 auto; }
}
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav-bar">
  <img src="image.png" alt="Treino" class="nav-logo">
  <div class="nav-tabs" id="navTabs"></div>
</nav>

<!-- Screens -->
<div id="screen-dashboard" class="screen"></div>
<div id="app"></div>
<div id="banner" class="banner"></div>

<!-- Floating Action Bar (hidden by default, shown during workout) -->
<div class="action-bar" id="actionBar" style="display:none">
  <button class="finish-btn" id="finishBtn">Finalizar Treino</button>
</div>

<script>
// ── Data ──
const workouts = { A: [
  { name:"Mobilidade", reps:"Sequência", load:"0 kg", mobility:true, list:["Floppy arm - 10","Cat/cow - 10","Best stretch - 10"] },
  { name:"Pallof Press", reps:"10-12 / lado", load:"elástico", time:40, rest:30 },
  { name:"Agachamento unilateral", reps:"12", load:"5 kg", time:40, rest:30 },
  { name:"Flexão de braço", reps:"8-12", load:"peso corporal", time:40, rest:30 },
  { name:"Rotação externa do antebraço", reps:"10", load:"4 kg", time:40, rest:30 },
  { name:"Sleeper Stretch", reps:"1", load:"0 kg", mobility:true, list:[] }
], B: [
  { name:"Mobilidade", reps:"Sequência", load:"0 kg", mobility:true, list:["Floppy arm - 10","Cat/cow - 10","Best stretch - 10"] },
  { name:"Barra fixa", reps:"4 / 3 / 2", load:"peso corporal", time:40, rest:30 },
  { name:"Remada", reps:"10-12", load:"kettlebell 12 kg", time:40, rest:30 },
  { name:"Levantamento terra KB", reps:"12", load:"15 kg", time:40, rest:30 },
  { name:"Hanging Knee Raise", reps:"8-12", load:"peso corporal", time:40, rest:30 }
]};

let currentTimer = null;
let activeWorkoutKey = null;

// ── Timer ──
function startCountdown(seconds, display, labelEl) {
  clearInterval(currentTimer);
  display.classList.remove("idle");
  display.classList.add("running");
  display.style.color = "";
  let t = seconds;
  display.textContent = format(t);
  if (labelEl) labelEl.textContent = "⏱️ Descanse";
  currentTimer = setInterval(function() {
    t--;
    display.textContent = format(t);
    if (t <= 5 && t > 0) {
      display.style.color = "var(--accent-warning)";
    }
    if (t < 0) {
      display.textContent = "✅ Pronto!";
      display.classList.remove("running");
      display.classList.add("idle");
      display.style.color = "";
      if (labelEl) labelEl.textContent = "💪 Próxima série";
      clearInterval(currentTimer);
    }
  }, 1000);
}

function format(s) {
  var sign = s < 0 ? "-" : "";
  s = Math.abs(s);
  var min = Math.floor(s / 60);
  var sec = s % 60;
  return sign + min + ":" + sec.toString().padStart(2, "0");
}

// ── Navigation ──
function renderNav() {
  var tabs = document.getElementById("navTabs");
  var items = [
    { id:"dash", label:"Dashboard" },
    { id:"A", label:"Treino A" },
    { id:"B", label:"Treino B" }
  ];
  tabs.innerHTML = items.map(function(t) {
    return '<button class="nav-tab" data-screen="' + t.id + '">' + t.label + '</button>';
  }).join("");
  tabs.querySelectorAll(".nav-tab").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var id = btn.getAttribute("data-screen");
      if (id === "dash") showDashboard();
      else showWorkout(id);
    });
  });
}

function setActiveNav(id) {
  document.querySelectorAll(".nav-tab").forEach(function(b) {
    b.classList.toggle("active", b.getAttribute("data-screen") === id);
  });
}

function showWorkout(key) {
  activeWorkoutKey = key;
  document.getElementById("screen-dashboard").classList.remove("visible");
  document.querySelectorAll(".workout").forEach(function(c) { c.classList.remove("visible"); });
  document.getElementById("workout" + key).classList.add("visible");
  document.getElementById("actionBar").style.display = "block";
  setActiveNav(key);
  localStorage.setItem("treino_selected", key);
  updateProgressRing(key);
}

function showDashboard() {
  activeWorkoutKey = null;
  document.querySelectorAll(".workout").forEach(function(c) { c.classList.remove("visible"); });
  document.getElementById("screen-dashboard").classList.add("visible");
  document.getElementById("actionBar").style.display = "none";
  setActiveNav("dash");
  renderDashboard();
}

// ── Progress Ring ──
function updateProgressRing(key) {
  var container = document.getElementById("workout" + key);
  if (!container) return;
  var checkBtns = container.querySelectorAll(".check-btn");
  var total = checkBtns.length;
  var done = 0;
  checkBtns.forEach(function(b) { if (b.classList.contains("completed")) done++; });
  var pct = total > 0 ? Math.round(done / total * 100) : 0;
  var ringFg = container.querySelector(".progress-ring-fg");
  var ringText = container.querySelector(".progress-ring-text");
  if (ringFg) {
    var circ = 2 * Math.PI * 15.9155;
    ringFg.style.strokeDasharray = circ;
    ringFg.style.strokeDashoffset = circ - (pct / 100) * circ;
  }
  if (ringText) ringText.textContent = pct + "%";
}

// ── Render Workout ──
function renderWorkout(key) {
  var list = workouts[key];
  var container = document.createElement("div");
  container.className = "workout";
  container.id = "workout" + key;

  // Header with progress ring
  var header = document.createElement("div");
  header.className = "workout-header";
  header.innerHTML =
    '<div class="workout-header-left">' +
      '<span class="station-badge">' + key + '</span>' +
      '<div><h1>Treino ' + key + '</h1>' +
      '<div class="workout-sub">' + (key === "A" ? "Peito, Ombro e Tríceps" : "Costas e Quadril") + '</div></div>' +
    '</div>' +
    '<div class="progress-ring-wrap">' +
      '<svg viewBox="0 0 36 36" width="48" height="48">' +
        '<circle class="progress-ring-bg" cx="18" cy="18" r="15.9155"/>' +
        '<circle class="progress-ring-fg" cx="18" cy="18" r="15.9155"/>' +
      '</svg>' +
      '<div class="progress-ring-text">0%</div>' +
    '</div>';
  container.appendChild(header);

  list.forEach(function(ex, i) {
    var card = document.createElement("div");
    card.className = "exercise-card";
    card.dataset.index = i;

    // Timer bar for non-mobility exercises
    if (!ex.mobility) {
      var timerBar = document.createElement("div");
      timerBar.className = "timer-bar idle";
      timerBar.id = "timer" + key + i;
      timerBar.innerHTML = '<span class="timer-label">💪 Vamos começar!</span>';
      card.appendChild(timerBar);
    }

    // Card header
    var cardHdr = document.createElement("div");
    cardHdr.className = "card-header";
    var repsDisplay = ex.mobility ? "" : " • " + ex.reps + " Reps";
    var restDisplay = ex.mobility ? "" : " • " + ex.rest + "s Descanso";
    cardHdr.innerHTML =
      '<div class="exercise-info">' +
        '<h2>' + ex.name + '</h2>' +
        '<span class="exercise-meta">3 Séries' + repsDisplay + restDisplay + '</span>' +
      '</div>' +
      '<button class="video-btn">▶</button>';
    card.appendChild(cardHdr);

    // Mobility or sets
    if (ex.mobility) {
      if (ex.list && ex.list.length) {
        var ul = document.createElement("ul");
        ul.className = "mobility-list";
        ex.list.forEach(function(item) {
          var li = document.createElement("li");
          li.textContent = item;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
    } else {
      var setsDiv = document.createElement("div");
      setsDiv.className = "sets-container";
      for (var s = 0; s < 3; s++) {
        var row = document.createElement("div");
        row.className = "set-row";
        var loadVal = ex.load === "peso corporal" ? "" : ex.load.replace(/[^0-9]/g, "");
        row.innerHTML =
          '<span class="set-index">' + (s + 1) + '</span>' +
          '<input type="number" class="input-set" placeholder="Kg" value="' + loadVal + '" inputmode="decimal">' +
          '<input type="number" class="input-set" placeholder="Reps" value="' + ex.reps.split("-")[0].trim() + '" inputmode="numeric">' +
          '<button class="check-btn">✓</button>';
        setsDiv.appendChild(row);
      }
      card.appendChild(setsDiv);
    }
    container.appendChild(card);
  });

  document.getElementById("app").appendChild(container);

  // Bind check buttons
  bindCheckButtons(key);

  // Bind video buttons (placeholder)
  container.querySelectorAll(".video-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      // Placeholder - could open video ref
    });
  });
}

// ── Bind Check Buttons ──
function bindCheckButtons(key) {
  var container = document.getElementById("workout" + key);
  var list = workouts[key];

  container.querySelectorAll(".check-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      btn.classList.toggle("completed");
      var completed = btn.classList.contains("completed");

      // Find parent exercise card
      var card = btn.closest(".exercise-card");
      if (!card) return;
      var idx = parseInt(card.dataset.index);
      var ex = list[idx];
      if (!ex || ex.mobility) return;

      // Get timer bar for this exercise
      var timerBar = document.getElementById("timer" + key + idx);

      if (completed) {
        // Start rest timer
        timerBar.classList.remove("idle");
        timerBar.classList.add("rest");
        timerBar.innerHTML = '<span class="timer-label">⏱️ Descanse</span>';
        startCountdown(ex.rest, timerBar, timerBar.querySelector(".timer-label"));
      } else {
        // Unchecking - clear timer and reset
        clearInterval(currentTimer);
        timerBar.classList.remove("running", "rest");
        timerBar.classList.add("idle");
        timerBar.innerHTML = '<span class="timer-label">💪 Vamos começar!</span>';
      }

      updateProgressRing(key);
      checkWorkoutComplete(key);
    });
  });
}

// ── Check Workout Complete ──
function checkWorkoutComplete(key) {
  var container = document.getElementById("workout" + key);
  var list = workouts[key];
  var allDone = true;
  container.querySelectorAll(".exercise-card").forEach(function(card, i) {
    if (list[i].mobility) return;
    var checks = card.querySelectorAll(".check-btn");
    var anyMissing = false;
    checks.forEach(function(b) { if (!b.classList.contains("completed")) anyMissing = true; });
    if (anyMissing) allDone = false;
  });
  if (allDone) completeWorkout(key);
}

// ── Completion ──
function completeWorkout(key) {
  logWorkout(key);
  showBanner(key);
}

function logWorkout(key) {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");
  var today = new Date().toISOString().slice(0, 10);
  var entry = { date: today, type: key, completedAt: new Date().toISOString() };
  var idx = log.findIndex(function(e) { return e.date === today && e.type === key; });
  if (idx >= 0) log[idx] = entry; else log.push(entry);
  localStorage.setItem("treino_log", JSON.stringify(log));
}

function showBanner(key) {
  var banner = document.getElementById("banner");
  banner.innerHTML = "🎉 Treino " + key + " concluído!" +
    '<br><button class="btn-dash" onclick="showDashboard()">Ver Dashboard</button>';
  banner.classList.add("show");
  setTimeout(function() {
    banner.classList.remove("show");
    showDashboard();
  }, 3000);
}

// ── Finish Button ──
document.getElementById("finishBtn").addEventListener("click", function() {
  if (activeWorkoutKey) completeWorkout(activeWorkoutKey);
});

// ── Persistence ──
function setupPersistence(key) {
  var container = document.getElementById("workout" + key);
  var list = workouts[key];
  container.querySelectorAll(".exercise-card").forEach(function(card, i) {
    var inputs = card.querySelectorAll(".input-set");
    if (inputs.length === 0) return;
    var prefix = "treino" + key + "_";
    var savedLoad = localStorage.getItem(prefix + "load_" + i);
    var savedReps = localStorage.getItem(prefix + "reps_" + i);
    // Apply to all set rows (same weight/reps per exercise)
    card.querySelectorAll(".input-set").forEach(function(inp, idx) {
      if (idx % 2 === 0) { // kg inputs
        if (savedLoad !== null) inp.value = savedLoad;
        inp.addEventListener("input", function() {
          localStorage.setItem(prefix + "load_" + i, inp.value);
        });
      } else { // reps inputs
        if (savedReps !== null) inp.value = savedReps;
        inp.addEventListener("input", function() {
          localStorage.setItem(prefix + "reps_" + i, inp.value);
        });
      }
    });
  });
}

// ── Dashboard ──
function renderDashboard() {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");

  var lastText = "Nenhum";
  if (log.length > 0) {
    var last = log[log.length - 1];
    var d = new Date(last.completedAt);
    lastText = "Treino " + last.type + " — " + d.toLocaleDateString("pt-BR");
  }

  var total = log.length;

  var streak = 0;
  if (log.length > 0) {
    var sorted = log.slice().sort(function(a, b) { return b.date.localeCompare(a.date); });
    var lastDate = sorted[0].date;
    var todayDate = new Date();
    var lastDt = new Date(lastDate + "T12:00:00");
    var diffDays = Math.round((todayDate - lastDt) / 86400000);
    if (diffDays <= 1) {
      streak = 1;
      for (var si = 1; si < sorted.length; si++) {
        var prev = new Date(sorted[si-1].date + "T12:00:00");
        var curr = new Date(sorted[si].date + "T12:00:00");
        if (Math.round((prev - curr) / 86400000) === 1) streak++; else break;
      }
    }
  }

  var distA = log.filter(function(e) { return e.type === "A"; }).length;
  var distB = log.filter(function(e) { return e.type === "B"; }).length;
  var distTotal = distA + distB || 1;
  var pctA = Math.round(distA / distTotal * 100);
  var pctB = Math.round(distB / distTotal * 100);

  var weekDays = "";
  for (var wi = 6; wi >= 0; wi--) {
    var d = new Date();
    d.setDate(d.getDate() - wi);
    var dateStr = d.toISOString().slice(0, 10);
    var dayLabel = d.toLocaleDateString("pt-BR", { weekday: "short" }).slice(0, 3);
    var trained = log.some(function(e) { return e.date === dateStr; });
    weekDays +=
      '<div class="dash-day"><div class="dash-day-label">' + dayLabel + '</div>' +
      '<div class="dash-day-dot ' + (trained ? "on" : "off") + '">' + (trained ? "✓" : "✗") + '</div></div>';
  }

  document.getElementById("screen-dashboard").innerHTML =
    '<div class="dash-header">' +
      '<h1>🏋️ Dashboard</h1>' +
      '<p>Seu progresso nos treinos</p>' +
    '</div>' +
    '<div class="dash-grid">' +
      '<div class="dash-workout-grid">' +
        '<div class="dash-workout-btn" onclick="showWorkout(\'A\')">' +
          '<span class="station-badge station-badge-lg">A</span>' +
          '<div><div class="dash-workout-label">Treino A</div><div class="dash-workout-sub">' + distA + ' treinos realizados</div></div>' +
        '</div>' +
        '<div class="dash-workout-btn" onclick="showWorkout(\'B\')">' +
          '<span class="station-badge station-badge-lg">B</span>' +
          '<div><div class="dash-workout-label">Treino B</div><div class="dash-workout-sub">' + distB + ' treinos realizados</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="dash-card"><div class="dash-card-title">Último treino</div><div class="dash-card-value">' + lastText + '</div></div>' +
      '<div class="dash-card"><div class="dash-card-title">Total de treinos</div><div class="dash-card-value">' + total + '</div></div>' +
      '<div class="dash-card"><div class="dash-card-title">Sequência atual</div><div class="dash-card-value">' + (streak > 0 ? "🔥 " : "") + streak + '</div><div class="dash-card-sub">' + (streak === 1 ? "dia" : "dias") + ' seguidos</div></div>' +
      '<div class="dash-card"><div class="dash-card-title">Distribuição</div>' +
        '<div class="dash-dist"><div class="dash-dist-row"><span>Treino A</span><span>' + distA + '</span></div><div class="dash-dist-row"><span>Treino B</span><span>' + distB + '</span></div></div>' +
        '<div class="dash-bar"><div class="dash-bar-a" style="width:' + pctA + '%"></div><div class="dash-bar-b" style="width:' + pctB + '%"></div></div>' +
      '</div>' +
      '<div class="dash-card"><div class="dash-card-title">Últimos 7 dias</div><div class="dash-week">' + weekDays + '</div></div>' +
      '<button class="btn-export" onclick="exportHistory()">Exportar histórico (CSV)</button>' +
    '</div>';
}

function exportHistory() {
  var log = JSON.parse(localStorage.getItem("treino_log") || "[]");
  if (log.length === 0) return;
  var csv = "date,type,completedAt\n" + log.map(function(e) { return e.date + "," + e.type + "," + e.completedAt; }).join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "treino_log.csv";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Init ──
renderNav();
renderWorkout("A");
renderWorkout("B");
setupPersistence("A");
setupPersistence("B");

// Restore last selected workout
var saved = localStorage.getItem("treino_selected");
if (saved === "A" || saved === "B") {
  showWorkout(saved);
} else {
  showDashboard();
}
</script>
